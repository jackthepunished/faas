# Synthetic time-series fixture for the FaasCpuStarvation alert
# (issue #301, ADR-044).
#
# What this exercises:
#   1. FaasCpuStarvation — the per-plan CPU starvation alert. It must
#      fire when vmmd_cpu_throttle_ratio{slice} exceeds 0.8 for 5m on a
#      per-plan sub-slice (tenant-free|tenant-hobby|tenant-pro|
#      tenant-scale), and must NOT fire on a sub-threshold slice
#      (negative case) or on a non-matching slice label
#      (sanity check on the {slice=~"tenant-.*"} regex).
#   2. The sibling cumulative counter
#      vmmd_cpu_throttle_seconds_total{account_id, app_id} is fed by
#      the fixture too — the rollup survives a regression that
#      removes the gauge's emitter (acceptance #4 of issue #301).
#
# Why this is the canonical synthetic-fixture test: TestFaasRulesSyntax
# validates the rule file's syntax via `promtool check rules`
# (parse-only); this test feeds real samples through the alert
# evaluator and asserts the alert opens at the configured threshold.
# No daemon-side state, no live vmmd instance required — pure
# rule-engine evaluation.
#
# Fixture shape note: the rule uses
# `vmmd_cpu_throttle_ratio{slice=~"tenant-.*"} > 0.8` — i.e. it reads
# the gauge directly (the gauge is computed inside vmmd as
# throttle_delta / (throttle_delta + usage_delta) over the per-tick
# 5m window; see pkg/fcvm/cpustats/cache.go and ADR-044 §Decision 4).
# The alert's `for: 5m` window must see the gauge above 0.8 for that
# whole interval before firing. Synthetic fixture: feed a gauge
# series above 0.8 for 15m (well past the 5m `for:` window) and
# assert the alert opens.

rule_files:
  - ../../../deploy/ansible/roles/prometheus/files/faas.rules.yml

evaluation_interval: 30s

tests:
  # ──────────────────────────────────────────────────────────────
  # Test 1 — starving slice at 0.95 throttle ratio for 15m →
  # FaasCpuStarvation fires.
  # ──────────────────────────────────────────────────────────────
  - interval: 30s
    name: "tenant-hobby slice at 0.95 throttle for 15m → FaasCpuStarvation fires"
    input_series:
      # The starving slice. Gauge value 0.95 for 15m = 30 samples.
      # The `for: 5m` window (10 samples at 30s) must have fully
      # elapsed before the alert opens.
      - series: 'vmmd_cpu_throttle_ratio{slice="tenant-hobby"}'
        values: '0.95x30'
      # Sibling slice below the threshold — must NOT contribute
      # an alert.
      - series: 'vmmd_cpu_throttle_ratio{slice="tenant-pro"}'
        values: '0.20x30'
      # A non-matching slice label (e.g. faas-tenant.slice itself,
      # the parent) — the {slice=~"tenant-.*"} regex excludes this
      # so it must NOT trigger the alert.
      - series: 'vmmd_cpu_throttle_ratio{slice="faas-tenant"}'
        values: '0.99x30'
      # Sibling cumulative counter — pre-instantiated so the
      # rollup survives a regression that removes the gauge's
      # emitter. Issue #301 acceptance #4.
      - series: 'vmmd_cpu_throttle_seconds_total{account_id="acct-cpu",app_id="app-cpu"}'
        values: '0+100x30'
    alert_rule_test:
      # eval_time = 15m puts us well past the 5m `for:` window
      # since the starving series began. The alert must be
      # active with the offending slice label.
      - eval_time: 15m
        alertname: FaasCpuStarvation
        exp_alerts:
          - exp_labels:
              severity: warn
              component: vmmd
              family: cpu_starvation
              slice: tenant-hobby
            exp_annotations:
              summary: "Tenant slice tenant-hobby throttled > 80% for 5m"
              description: "Plan sub-slice tenant-hobby has been > 80% throttled over the rolling 5-minute window for 5m (issue #301 / ADR-044). The cpu.max quota for that plan is saturated; quiescent workloads are preempted. Cross-check the top-throttled-apps Grafana panel for which (account_id, app_id) is the dominant offender, then follow docs/runbooks/FaasCpuStarvation.md §Recover."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCpuStarvation.md"

  # ──────────────────────────────────────────────────────────────
  # Test 2 — sub-threshold slice at 0.50 throttle → alert does
  # NOT fire (negative case: ratio is below the 0.8 comparator).
  # ──────────────────────────────────────────────────────────────
  - interval: 30s
    name: "tenant-pro slice at 0.50 throttle → FaasCpuStarvation does NOT fire"
    input_series:
      - series: 'vmmd_cpu_throttle_ratio{slice="tenant-pro"}'
        values: '0.50x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: FaasCpuStarvation
        # No exp_alerts → assert the alert is NOT active.

  # ──────────────────────────────────────────────────────────────
  # Test 3 — burst pattern: 0.99 for 2m, then 0.10 for 13m →
  # alert does NOT fire (the `for: 5m` debounce suppresses short
  # bursts). The first 2m above 0.8 must NOT cross the 5m
  # threshold even at eval_time = 15m.
  # ──────────────────────────────────────────────────────────────
  - interval: 30s
    name: "burst 2m above 0.8 then 13m below → alert does NOT fire"
    input_series:
      # 0.99 for 4 samples (2m), then 0.10 for 26 samples (13m).
      # Total 30 samples = 15m, same window as test 1.
      - series: 'vmmd_cpu_throttle_ratio{slice="tenant-scale"}'
        values: '0.99x4 0.10x26'
    alert_rule_test:
      - eval_time: 15m
        alertname: FaasCpuStarvation
        # No exp_alerts → assert the alert is NOT active.

  # ──────────────────────────────────────────────────────────────
  # Test 4 — non-matching slice label (faas-tenant, the parent)
  # at 0.99 throttle for 15m → alert does NOT fire (the
  # {slice=~"tenant-.*"} regex excludes the parent slice; only
  # per-plan sub-slices are eligible).
  # ──────────────────────────────────────────────────────────────
  - interval: 30s
    name: "parent slice faas-tenant at 0.99 throttle → FaasCpuStarvation does NOT fire"
    input_series:
      - series: 'vmmd_cpu_throttle_ratio{slice="faas-tenant"}'
        values: '0.99x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: FaasCpuStarvation
        # No exp_alerts → assert the alert is NOT active. The
      # parent's 0.99 throttle ratio is intentionally above 0.8
      # to pin that the {slice=~"tenant-.*"} regex is what
      # excludes it — a regression that removed the regex
      # would trip the alert here.

  # ──────────────────────────────────────────────────────────────
  # Test 5 — multiple starving slices: each fires its own alert
  # (the per-slice label survives Alertmanager routing so a
  # single plan starving fires one page; multiple plans starving
  # surface multiple pages with per-plan drill-down).
  # ──────────────────────────────────────────────────────────────
  - interval: 30s
    name: "3 starving slices → 3 distinct FaasCpuStarvation alerts"
    input_series:
      - series: 'vmmd_cpu_throttle_ratio{slice="tenant-free"}'
        values: '0.90x30'
      - series: 'vmmd_cpu_throttle_ratio{slice="tenant-hobby"}'
        values: '0.95x30'
      - series: 'vmmd_cpu_throttle_ratio{slice="tenant-scale"}'
        values: '0.99x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: FaasCpuStarvation
        exp_alerts:
          - exp_labels:
              severity: warn
              component: vmmd
              family: cpu_starvation
              slice: tenant-free
            exp_annotations:
              summary: "Tenant slice tenant-free throttled > 80% for 5m"
              description: "Plan sub-slice tenant-free has been > 80% throttled over the rolling 5-minute window for 5m (issue #301 / ADR-044). The cpu.max quota for that plan is saturated; quiescent workloads are preempted. Cross-check the top-throttled-apps Grafana panel for which (account_id, app_id) is the dominant offender, then follow docs/runbooks/FaasCpuStarvation.md §Recover."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCpuStarvation.md"
          - exp_labels:
              severity: warn
              component: vmmd
              family: cpu_starvation
              slice: tenant-hobby
            exp_annotations:
              summary: "Tenant slice tenant-hobby throttled > 80% for 5m"
              description: "Plan sub-slice tenant-hobby has been > 80% throttled over the rolling 5-minute window for 5m (issue #301 / ADR-044). The cpu.max quota for that plan is saturated; quiescent workloads are preempted. Cross-check the top-throttled-apps Grafana panel for which (account_id, app_id) is the dominant offender, then follow docs/runbooks/FaasCpuStarvation.md §Recover."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCpuStarvation.md"
          - exp_labels:
              severity: warn
              component: vmmd
              family: cpu_starvation
              slice: tenant-scale
            exp_annotations:
              summary: "Tenant slice tenant-scale throttled > 80% for 5m"
              description: "Plan sub-slice tenant-scale has been > 80% throttled over the rolling 5-minute window for 5m (issue #301 / ADR-044). The cpu.max quota for that plan is saturated; quiescent workloads are preempted. Cross-check the top-throttled-apps Grafana panel for which (account_id, app_id) is the dominant offender, then follow docs/runbooks/FaasCpuStarvation.md §Recover."
              runbook_url: "https://github.com/poyrazK/faas/blob/main/docs/runbooks/FaasCpuStarvation.md"