# Issue #911 / ADR-110 inventory. Three groups so bootstrap.yml's
# three plays (control_plane / compute_nodes / box) all have a
# matching host set. The `[box]` group is the legacy single-box dev
# shape (`make bootstrap` against 127.0.0.1); `[box:children]`
# aggregates the multi-box groups so the legacy target keeps working
# against the same host set as the split-box targets.
#
# Per ADR-092, host_vars/faas-fsn-{1,2}.yml pin `faas_box_role` and
# `faas_node_name` so the per-box PKI subset + role gate line up.
# Per-box connection vars (ansible_host, ansible_python_interpreter)
# also live in host_vars — keeps the inventory to group-shape only
# so a fleet cutover doesn't require editing this file by hand.
#
# `ansible_connection=local` on the [box] dev entry skips SSH; the
# pinned python3.12 interpreter matches the Ubuntu 24.04 system
# interpreter so we never depend on a venv.
[control_plane]
faas-fsn-1

[compute_nodes]
faas-fsn-2

[box]
127.0.0.1 ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[box:children]
control_plane
compute_nodes
