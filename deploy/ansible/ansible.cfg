[defaults]
inventory = inventory
roles_path = .
stdout_callback = yaml
# Host-key checking is meaningless against the local box; turning it off
# keeps `make bootstrap` working straight out of a fresh image where sshd
# hasn't seen its own keys yet.
host_key_checking = False
# forks=1 — the bootstrap playbook targets one host at a time
# (`serial: 1` on the play enforces per-host serial run; `forks`
# controls intra-host parallelism). forks=1 keeps the play
# deterministic and avoids spawning N parallel sudo sessions on a
# single host that has nothing to parallelize.
forks = 1
# Treat warnings (especially about deprecated ansible core features)
# as hard errors — we want to see drift, not paper over it.
deprecation_warnings = True
interpreter_python = /usr/bin/python3
