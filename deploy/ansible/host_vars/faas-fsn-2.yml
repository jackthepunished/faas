# Gate-B (issue #297 / ADR-025 §Tier 2) compute-only box.
# fsn-2 runs vmmd, gatewayd-internal, builderd, imaged.
# Postgres + the Tier 1 PKI CA live on fsn-1; this box dials schedd over
# the overlay network (Tail/wg) with the per-node client cert vmmd's
# `gregale pki init --box-role=compute-only` (PR-3) lays out under
# /etc/faas/tls/vmmd/schedd-client.{crt,key}.
#
# The role gate (pkg/role, PR-1) refuses to start vmmd/gatewayd-internal/
# builderd/imaged under RoleControlPlane; the var below is the deploy-time
# source of truth — every daemon's systemd unit reads it via
# FAAS_<DAEMON>_ROLE.

faas_box_role: compute-only
faas_node_name: fsn-2