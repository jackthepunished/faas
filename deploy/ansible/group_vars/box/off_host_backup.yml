# group_vars/box/off_host_backup.yml — off-host storage box wiring (issue #250).
#
# Read from the operator shell at ansible-run time via lookup('env',
# 'VAR_NAME'). The vars land in `off_host_backup_*` and feed both:
#   * the postgres_backup role's fail-closed assert (vars are
#     required, not optional),
#   * the postgres role's archive_command template
#     (off_host_backup_wal_path),
#   * the postgres_backup role's push service
#     (OFF_HOST_BACKUP_BASEBACKUP_PATH is sourced from the same
#     var via EnvironmentFile=/etc/faas/sealed.env at runtime).
#
# Set OFF_HOST_BACKUP_USER / OFF_HOST_BACKUP_HOST in
# /etc/faas/sealed.env (operator-provisioned surface — see
# deploy/controlplane/sealed.env.example, RETIRED 2026-08-15 by
# issue #911 / PR-1; the v2 path is PR-X `gregalectl secrets init`).
# The vars are intentionally left un-defaulted; the postgres_backup
# role refuses to deploy off-host backup without a real endpoint.
#
# PR-8 (issue #911 / ADR-110 deferred): renamed from hetzner.yml +
# renamed vars from hetzner_storage_box_* → off_host_backup_*. The
# on-disk sealed envelope path /etc/faas/secrets/storage-box/rclone.conf
# stays (the LoadCredential= in 99-faas-off-host-backup.conf references
# it). Operators with HETZNER_STORAGE_BOX_* in /etc/faas/sealed.env
# must update to OFF_HOST_BACKUP_* on next bootstrap — see
# docs/runbooks/manifest-renderer-cutover.md §Pre-flight.

off_host_backup_user: "{{ lookup('env', 'OFF_HOST_BACKUP_USER') | default('', true) }}"
off_host_backup_host: "{{ lookup('env', 'OFF_HOST_BACKUP_HOST') | default('', true) }}"
off_host_backup_basebackup_path: "faas-pg-basebackup"
off_host_backup_wal_path: "faas-pg-wal"