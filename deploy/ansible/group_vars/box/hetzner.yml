# group_vars/box/hetzner.yml — Hetzner Storage Box wiring (issue #250).
#
# Read from the operator shell at ansible-run time via lookup('env',
# 'VAR_NAME'). The vars land in `hetzner_storage_box_*` and feed
# both:
#   * the postgres_backup role's fail-closed assert (vars are
#     required, not optional),
#   * the postgres role's archive_command template
#     (hetzner_storage_box_wal_path),
#   * the postgres_backup role's push service
#     (HETZNER_STORAGE_BOX_BASEBACKUP_PATH is sourced from the same
#     var via EnvironmentFile=/etc/faas/sealed.env at runtime).
#
# Set HETZNER_STORAGE_BOX_USER / HETZNER_STORAGE_BOX_HOST in
# /etc/faas/sealed.env (operator-provisioned surface — see
# deploy/controlplane/sealed.env.example). The vars are intentionally
# left un-defaulted; the postgres_backup role refuses to deploy
# off-host backup without a real endpoint.

hetzner_storage_box_user: "{{ lookup('env', 'HETZNER_STORAGE_BOX_USER') | default('', true) }}"
hetzner_storage_box_host: "{{ lookup('env', 'HETZNER_STORAGE_BOX_HOST') | default('', true) }}"
hetzner_storage_box_basebackup_path: "faas-pg-basebackup"
hetzner_storage_box_wal_path: "faas-pg-wal"
