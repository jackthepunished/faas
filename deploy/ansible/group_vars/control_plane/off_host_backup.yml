# group_vars/control_plane/off_host_backup.yml — off-host storage wiring
# (issue #250).
#
# The provider-specific endpoint and credentials live in rclone.conf. The
# Ansible contract only carries the stable remote alias and logical paths, so
# the same playbook works for Hetzner, OVH, GCP, or any S3/SFTP-compatible
# backend without per-provider host variables.

off_host_backup_remote: "offhostbox"
off_host_backup_basebackup_path: "faas-pg-basebackup"
off_host_backup_wal_path: "faas-pg-wal"
