[Service]
# Issue #250 — wire the rclone.conf credential + off_host_backup
# env var so archive_command can rclone WAL to the off-host storage box.
#
# LoadCredential: surfaces the (sealed-at-rest, plaintext-at-runtime)
# rclone.conf inside the unit's $CREDENTIALS_DIRECTORY. The
# archive_command in the installed PostgreSQL cluster config reads it
# via `--config=%d/faas_off_host_backup_rclone` (systemd expands %d at
# activation). This keeps the sealed rclone.conf out of the postgres
# data dir and out of /etc/postgresql/.
#
# Environment= passes off_host_backup_wal_path through to
# archive_command. Default = faas-pg-wal; operators override per
# storage-box layout.
#
# PR-8 (issue #911 / ADR-110 deferred): renamed from
# 99-faas-storage-box.conf. The HETZNER_STORAGE_BOX_WAL_PATH env var
# became OFF_HOST_BACKUP_WAL_PATH. The LoadCredential= on-disk path
# /etc/faas/secrets/storage-box/rclone.conf stays (separate concept —
# the sealed envelope, not the env var). Operators must rename the
# env var in /etc/faas/sealed.env on next bootstrap — see
# docs/runbooks/manifest-renderer-cutover.md §Pre-flight.
LoadCredential=faas_off_host_backup_rclone:/etc/faas/secrets/storage-box/rclone.conf
Environment=OFF_HOST_BACKUP_WAL_PATH=faas-pg-wal
