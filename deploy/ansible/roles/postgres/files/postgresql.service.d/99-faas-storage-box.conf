[Service]
# Issue #250 — wire the rclone.conf credential + hetzner_storage_box
# env var so archive_command can rclone WAL to Hetzner Storage Box.
#
# LoadCredential: surfaces the (sealed-at-rest, plaintext-at-runtime)
# rclone.conf inside the unit's $CREDENTIALS_DIRECTORY. The
# archive_command in /etc/postgresql/15/main/postgresql.conf reads it
# via `--config=%d/faas_storage_box_rclone` (systemd expands %d at
# activation). This keeps the sealed rclone.conf out of the postgres
# data dir and out of /etc/postgresql/.
#
# Environment= passes hetzner_storage_box_wal_path through to
# archive_command. Default = faas-pg-wal; operators override per
# storage-box layout.
LoadCredential=faas_storage_box_rclone:/etc/faas/secrets/storage-box/rclone.conf
Environment=HETZNER_STORAGE_BOX_WAL_PATH=faas-pg-wal
