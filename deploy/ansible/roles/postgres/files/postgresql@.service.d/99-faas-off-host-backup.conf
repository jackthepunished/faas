[Service]
# Issue #250 — configure the actual PostgreSQL cluster template, not the
# package's aggregate postgresql.service target. The cluster process is the
# process that executes archive_command; placing this drop-in on the target
# unit only made the aggregate unit fail when the optional credential was
# absent while leaving the database process unconfigured.
#
# The credential source is optional by design. A new box can run PostgreSQL
# and retain WAL locally before the operator provisions the off-host backend.
# systemd stages the plaintext only in the unit credential directory.
LoadCredential=faas_off_host_backup_rclone:-/etc/faas/secrets/storage-box/rclone.conf
Environment=FAAS_OFF_HOST_BACKUP_RCLONE_CONFIG=%d/faas_off_host_backup_rclone
Environment=OFF_HOST_BACKUP_REMOTE={{ off_host_backup_remote | default('offhostbox', true) }}
Environment=OFF_HOST_BACKUP_WAL_PATH={{ off_host_backup_wal_path | default('faas-pg-wal', true) }}
