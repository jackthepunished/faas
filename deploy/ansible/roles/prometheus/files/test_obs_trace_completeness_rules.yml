# Synthetic rule slice used by test_obs_trace_completeness.yml.
# Mirrors the recording rule + Page alert from
# deploy/ansible/roles/prometheus/files/faas.rules.yml. Kept
# hand-duplicated (single-rule guard, single test page alert) so
# the promtool unit test stays self-contained and doesn't depend
# on the full rules file or its evaluators. Update in lockstep
# with the upstream recording rule.

groups:
  - name: test_obs_trace_completeness
    rules:
      - record: obs:operator_action_trace_completeness_ratio
        expr: clamp_min((min(schedd_operator_action_trace_completeness_ratio) unless on() (sum(schedd_operator_action_trace_completeness_ratio) == 0)) or on() vector(1), 0.001)
      - alert: TestPage
        expr: obs:operator_action_trace_completeness_ratio < 0.50
        for: 0m
        labels:
          severity: page
          family: obs_trace
          component: schedd
        annotations:
          summary: "trace completeness page"
          description: "test"
          runbook_url: "test"
