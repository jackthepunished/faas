# promtool unit tests for the obs-meta trace-completeness alarm
# surface (PR #1111 / fix-obs-page-alert-cold-start). Run with:
#
#   promtool test rules \
#     deploy/ansible/roles/prometheus/files/test_obs_trace_completeness.yml
#
# The four scenarios lock the cold-start guard on the
# `obs:operator_action_trace_completeness_ratio` recording rule:
#
#   1. cold_start_quiet — every kind reads the Prometheus GaugeVec
#      default (0) before the driver ticks. Recording rule must
#      substitute 1.0 (vacuous truth) so the Page alert
#      `< 0.50 for 10m` does NOT fire false-positive at t=10m on
#      every schedd restart. Without the guard, the recording rule
#      returns `clamp_min(0, 0.001) = 0.001` and the alert fires.
#
#   2. after_tick_quiet — every kind reads 1.0 after the first
#      successful driver tick (SQL aggregation pre-fills vacuous
#      truth for kinds with no rows in the 5m window at
#      pkg/sched/operator_intent_completeness.go:172-179).
#
#   3. real_drop_fires — one kind drops to 0.3 (real partial
#      coverage drop). Recording rule must return 0.3 so the Page
#      alert fires (`< 0.50 for 10m`, eval at t=4m with `for: 0m`
#      so the assert fires immediately).
#
#   4. panic_mid_tick_fires — driver goroutine panics after
#      partway through the kind loop; 3 kinds are Set to 1.0 but
#      2 remain at the Prometheus default 0. The recording rule
#      must still return 0 (sum != 0, so the cold-start guard does
#      NOT engage) and the alert fires — preserving the
#      panic-resilience contract pinned at
#      pkg/sched/operator_intent_completeness_test.go:118.
#
# The synthetic rule file under test mirrors the recording rule
# in faas.rules.yml (a hand-duplicated slice keeps the test
# self-contained; a full rules-file import is overkill for a
# single-rule guard). Update BOTH in lockstep.

rule_files:
  - test_obs_trace_completeness_rules.yml

evaluation_interval: 1m

tests:
  # 1. Cold start: every kind reads 0 (Prometheus default).
  - interval: 1m
    name: cold_start_quiet
    input_series:
      - series: 'schedd_operator_action_trace_completeness_ratio{kind="force_park"}'
        values: '0 0 0 0 0'
      - series: 'schedd_operator_action_trace_completeness_ratio{kind="force_cold_boot"}'
        values: '0 0 0 0 0'
      - series: 'schedd_operator_action_trace_completeness_ratio{kind="force_restart"}'
        values: '0 0 0 0 0'
      - series: 'schedd_operator_action_trace_completeness_ratio{kind="park_instance"}'
        values: '0 0 0 0 0'
      - series: 'schedd_operator_action_trace_completeness_ratio{kind="restart_instance"}'
        values: '0 0 0 0 0'
    alert_rule_test:
      - eval_time: 5m
        alertname: TestPage
        exp_alerts: []

  # 2. After first driver tick: every kind reads 1.0.
  - interval: 1m
    name: after_tick_quiet
    input_series:
      - series: 'schedd_operator_action_trace_completeness_ratio{kind="force_park"}'
        values: '1 1 1 1 1'
      - series: 'schedd_operator_action_trace_completeness_ratio{kind="force_cold_boot"}'
        values: '1 1 1 1 1'
      - series: 'schedd_operator_action_trace_completeness_ratio{kind="force_restart"}'
        values: '1 1 1 1 1'
      - series: 'schedd_operator_action_trace_completeness_ratio{kind="park_instance"}'
        values: '1 1 1 1 1'
      - series: 'schedd_operator_action_trace_completeness_ratio{kind="restart_instance"}'
        values: '1 1 1 1 1'
    alert_rule_test:
      - eval_time: 5m
        alertname: TestPage
        exp_alerts: []

  # 3. Real drop: force_park falls to 0.3 at t=4m.
  - interval: 1m
    name: real_drop_fires
    input_series:
      - series: 'schedd_operator_action_trace_completeness_ratio{kind="force_park"}'
        values: '1 1 1 0.3 0.3 0.3'
      - series: 'schedd_operator_action_trace_completeness_ratio{kind="force_cold_boot"}'
        values: '1 1 1 1 1 1'
      - series: 'schedd_operator_action_trace_completeness_ratio{kind="force_restart"}'
        values: '1 1 1 1 1 1'
      - series: 'schedd_operator_action_trace_completeness_ratio{kind="park_instance"}'
        values: '1 1 1 1 1 1'
      - series: 'schedd_operator_action_trace_completeness_ratio{kind="restart_instance"}'
        values: '1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 4m
        alertname: TestPage
        exp_alerts:
          - exp_labels:
              severity: page
              family: obs_trace
              component: schedd
            exp_annotations:
              summary: "trace completeness page"
              description: "test"
              runbook_url: "test"

  # 4. Panic mid-tick: 3 kinds Set to 1.0, 2 still at 0.
  # Cold-start guard must NOT engage (sum != 0) so the alert fires.
  - interval: 1m
    name: panic_mid_tick_fires
    input_series:
      - series: 'schedd_operator_action_trace_completeness_ratio{kind="force_park"}'
        values: '1 1 1 1 1'
      - series: 'schedd_operator_action_trace_completeness_ratio{kind="force_cold_boot"}'
        values: '1 1 1 1 1'
      - series: 'schedd_operator_action_trace_completeness_ratio{kind="force_restart"}'
        values: '1 1 1 1 1'
      - series: 'schedd_operator_action_trace_completeness_ratio{kind="park_instance"}'
        values: '0 0 0 0 0'
      - series: 'schedd_operator_action_trace_completeness_ratio{kind="restart_instance"}'
        values: '0 0 0 0 0'
    alert_rule_test:
      - eval_time: 5m
        alertname: TestPage
        exp_alerts:
          - exp_labels:
              severity: page
              family: obs_trace
              component: schedd
            exp_annotations:
              summary: "trace completeness page"
              description: "test"
              runbook_url: "test"
