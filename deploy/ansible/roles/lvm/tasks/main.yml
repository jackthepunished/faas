# lvm (spec §8) — verify-only.
#
# The lv-system (60 GB) and lv-fc (~452 GB) volumes are part of the
# Hetzner `installimage` recipe (the financial model §1 ties the snapshot
# budget to the 2×512 GB RAID-1 they come from). Re-creating them on a
# live box is out of scope for ansible and a one-time op; we just
# assert they exist + have the right size envelope.
#
# Provider-native disks (for example a GCP persistent disk) can use the
# filesystem layout directly. In `auto` mode the reference LVM layout is
# validated whenever LVs are detected; `reference-lvm` makes it mandatory.

- name: lvm — validate storage layout selector
  ansible.builtin.assert:
    that:
      - faas_storage_layout in ['auto', 'reference-lvm']
    fail_msg: >-
      faas_storage_layout must be `auto` or `reference-lvm`, got
      `{{ faas_storage_layout | default('unset') }}`.
  changed_when: false

- name: lvm — list LVs
  ansible.builtin.command: lvs --noheadings -o lv_name,lv_size --units g
  register: lvs_out
  changed_when: false
  check_mode: false
  failed_when: false

- name: lvm — classify the reference layout
  ansible.builtin.set_fact:
    faas_lvm_reference_detected: >-
      {{ 'lv-system' in lvs_out.stdout and 'lv-fc' in lvs_out.stdout }}
  changed_when: false

- name: lvm — assert lv-system (~60 GB) and lv-fc (~440 GB) exist
  ansible.builtin.assert:
    that:
      - "'lv-system' in lvs_out.stdout"
      - "'lv-fc' in lvs_out.stdout"
    fail_msg: >-
      Required LVs `lv-system` (~60 GB) and `lv-fc` (~440 GB) were not
      found. Re-image this EX44 with the project's installimage config
      (see `docs/faas_implementation_spec.md` §8). ansible will not
      create these — re-provisioning is a one-time op.
    success_msg: "lv-system + lv-fc present"
  when:
    - lvs_out.rc == 0
    - faas_storage_layout == 'reference-lvm' or (faas_lvm_reference_detected | bool)

- name: lvm — use provider-native filesystem layout
  ansible.builtin.debug:
    msg: >-
      No LVM volumes detected; continuing with the provider-native filesystem
      layout. Set faas_storage_layout=reference-lvm to require lv-system/lv-fc.
  when:
    - faas_storage_layout == 'auto'
    - lvs_out.rc == 0
    - not (faas_lvm_reference_detected | bool)
