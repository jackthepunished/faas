[Service]
# Issue #562 — wire the S3 archive credential envelope so the
# archive read-back handler (cmd/gatewayd-internal/app_logs_archive.go)
# can read the SAME envelope apid's shipper reads. Single source
# of truth on the box — both daemons read /etc/faas/secrets/
# storage-box/archive-creds.json via systemd `LoadCredential=`.
# The envelope is unsealed by `gregalectl backup unseal-archive-creds`
# (PR-A's CLI leaf); the plaintext never appears on the host
# filesystem outside the systemd credential dir.
#
# gatewayd-internal runs as faas:faas (NOT root), so the
# creds file must be readable by the faas group. Mirrors
# control_plane_service/files/faas-apid.service.d/
# 99-faas-log-archive.conf exactly — same envelope, same perms
# profile (0440 root:faas). The assert at
# deploy/ansible/roles/log_archive/tasks/main.yml pins both.
#
# ReadBackOnly note: gatewayd-internal ONLY reads from the
# bucket (no shipper loop, no spool writes). It therefore does
# NOT need ReadWritePaths=/var/log/faas/archive — only the
# LoadCredential line. The base unit already grants
# ReadWritePaths=/run/faas.
LoadCredential=faas_archive_creds:/etc/faas/secrets/storage-box/archive-creds.json
