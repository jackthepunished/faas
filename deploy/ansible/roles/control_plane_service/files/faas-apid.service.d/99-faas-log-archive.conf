[Service]
# Issue #562 — grant the S3 archive shipper its spool namespace.
# The archive credential is part of the apid base unit and is loaded
# optionally through systemd, so a missing envelope cannot block boot.
#
# The shipper fails closed on a missing envelope (the boot
# logs `logarchive.disabled reason="FAAS_LOG_ARCHIVE_BUCKET
# unset"` or `logarchive.creds_unavailable path=...`), so a
# box that hasn't been unsealed yet still boots — the in-process
# ring buffer remains the only log surface until the operator
# completes the post-install archive-creds unseal (v2 path is
# `gregalectl secrets init` + `gregalectl backup
# unseal-archive-creds`; the v1 bootstrap.sh step 11d handshake
# was retired by issue #911 / PR-1 on 2026-08-15).
#
# ReadWritePaths= grants /var/log/faas/archive write access
# (the spool dir). Matches the apid systemd unit's existing
# ReadWritePaths entry for /var/log/faas — the archive dir
# lives inside that namespace.
ReadWritePaths=/var/log/faas/archive
