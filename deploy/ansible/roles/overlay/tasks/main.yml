# Issue #98 / ADR-028: install + start the overlay daemon on each
# faas host. Split per-provider so an operator that already runs
# tailscale doesn't accidentally re-install it (the include_tasks
# below is gated on faas_overlay_provider).
#
# Cross-provider behaviour:
#   - Both providers install one systemd unit (faas-overlay.service)
#     that brings the tunnel up on boot. The unit is templated per
#     provider so the ExecStart= command matches the binary on PATH.
#   - Both providers write /etc/faas/overlay.env with the authkey
#     path + hostname, so daemons that need the overlay state
#     (gatewayd-internal, schedd) can read it without shell-out to
#     `tailscale status`.
#   - The role does NOT mint keys or join a tailnet. Operators own
#     the authkey flow; the role only consumes the authkey file
#     once the operator has placed it.
#
# Idempotency: ansible `package:` and `service:` modules are
# idempotent in their core semantics; the role re-asserts the
# desired state on every run, so a re-bootstrap after a host rebuild
# converges without manual intervention.

- name: overlay — install tailscale (provider=tailscale)
  ansible.builtin.include_tasks: tailscale.yml
  when: faas_overlay_provider == "tailscale"

- name: overlay — install wireguard (provider=wireguard)
  ansible.builtin.include_tasks: wireguard.yml
  when: faas_overlay_provider == "wireguard"

- name: overlay — use provider-native static network (provider=static)
  ansible.builtin.debug:
    msg: "Using the provider-native network on {{ faas_overlay_iface }}; no overlay daemon will be installed."
  when: faas_overlay_provider == "static"

# The private transport names are role-based (schedd.faas / vmmd.faas),
# while the manifest carries stable fleet hostnames. The generated
# inventory supplies this list and every box receives the same deterministic
# aliases. For hostname endpoints, the address is resolved from the
# provider's gathered host facts; no provider IP is copied into daemon
# configuration. Public Cloudflare DNS is never used for this private path.
- name: overlay — refuse unresolved private endpoint aliases
  ansible.builtin.assert:
    that:
      - private_address | length > 0
    fail_msg: >-
      private endpoint {{ item.names | join(', ') }} has no concrete address.
      Run the complete ansible-preflight first or provide
      faas_private_address for {{ item.inventory_host | default('the manifest host') }}.
  vars:
    private_address: >-
      {{ item.address | default(
           hostvars[item.inventory_host].faas_private_dns_address
           | default(hostvars[item.inventory_host].faas_private_address | default('', true), true),
           true) }}
  loop: "{{ faas_private_hosts | default([]) }}"
  loop_control:
    label: "{{ item.names | join(', ') }}"
  when:
    - (faas_private_hosts | default([]) | length) > 0
    - (faas_private_dns_mode | default('') in ['', 'managed_hosts'])
  tags: [private-endpoints]

- name: overlay — install manifest private endpoint aliases
  ansible.builtin.blockinfile:
    path: /etc/hosts
    create: true
    owner: root
    group: root
    mode: "0644"
    marker: "# {mark} FAAS MANIFEST PRIVATE ENDPOINTS"
    block: |
      {% for entry in faas_private_hosts | default([]) %}
      {% if entry.address | default('') | length > 0 %}
      {{ entry.address }} {{ entry.names | join(' ') }}
      {% else %}
      {{ hostvars[entry.inventory_host].faas_private_dns_address | default(hostvars[entry.inventory_host].faas_private_address | default(hostvars[entry.inventory_host].ansible_facts.default_ipv4.address)) }} {{ entry.names | join(' ') }}
      {% endif %}
      {% endfor %}
  when:
    - (faas_private_hosts | default([]) | length) > 0
    - (faas_private_dns_mode | default('') in ['', 'managed_hosts'])
  tags: [private-endpoints]

- name: overlay — verify manifest private endpoint resolution
  ansible.builtin.command:
    argv:
      - getent
      - ahostsv4
      - "{{ item.1 }}"
  loop: "{{ query('subelements', faas_private_hosts | default([]), 'names') }}"
  loop_control:
    label: "{{ item.1 }}"
  changed_when: false
  when:
    - (faas_private_hosts | default([]) | length) > 0
    - (faas_private_dns_mode | default('') in ['', 'managed_hosts'])
  tags: [private-endpoints]

# Cross-provider firewall rule: open the vmmd gRPC port on the
# overlay interface only. Tailscale ACLs handle auth; this rule
# is the kernel-level allow-list so the daemon port never binds on
# the public interface. Operators on dedicated boxes can drop this
# in favour of a tailscale ACL only; for the one-box prod shape
# both layers stay defensive.
- name: overlay — open vmmd port on overlay interface (nftables)
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: overlay — write vmmd port rule on overlay interface (nftables)
  ansible.builtin.copy:
    dest: /etc/nftables.d/faas-overlay.nft
    owner: root
    group: root
    mode: "0640"
    content: |
      table inet faas-overlay {
          chain input {
              type filter hook input priority 0; policy accept;
              iifname "{{ faas_overlay_iface }}" tcp dport {{ faas_overlay_vmmd_port }} accept comment "faas vmmd on overlay"
          }
      }
  notify: reload nftables

# The /etc/faas/overlay.env file is the read-only seam daemons
# use to find the overlay state. Today this just exposes the
# hostname; future fields (tag, owner email) join the same file
# so daemons read one path.
- name: overlay — write /etc/faas/overlay.env
  ansible.builtin.copy:
    dest: /etc/faas/overlay.env
    owner: root
    group: root
    mode: "0640"
    content: |
      FAAS_OVERLAY_PROVIDER={{ faas_overlay_provider }}
      FAAS_OVERLAY_IFACE={{ faas_overlay_iface }}
      FAAS_OVERLAY_HOSTNAME={{ faas_overlay_hostname }}
      FAAS_OVERLAY_VMMD_PORT={{ faas_overlay_vmmd_port }}
