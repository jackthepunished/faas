# gatewayd_public_service — install systemd unit + storage for
# gatewayd-public (Tier A7 split, ADR-070).
#
# Mirrors the gatewayd_service role shape: ship the unit, let the
# operator systemctl enable --now faas-gatewayd-public once the
# hetzner-dns.token is in place.
#
# What's NOT here (operator-provisioned):
#   - the hetzner-dns.token file (mode 0400, root:faas)
#   - the FAAS_NODE_ID / FAAS_NODE_NAME env file (operator-supplied
#     via systemd drop-in or a dedicated secrets dir)
#   - the cert storage contents (CertMagic creates them on first
#     start)

- name: gatewayd_public_service — install /var/lib/faas/certs (CertMagic storage)
  # CertMagic's file storage wants mode 0700. The systemd unit runs
  # the daemon as faas:faas; CertMagic writes renewed certs into
  # this directory. The dir MUST be owned by faas:faas — root:faas
  # 0700 leaves group-writable only for root, and the daemon
  # (running as faas) cannot write its renewed certs there.
  ansible.builtin.file:
    path: /var/lib/faas/certs
    state: directory
    owner: faas
    group: faas
    mode: "0700"

- name: gatewayd_public_service — install /var/lib/faas/ca (shared ACME account dir)
  # Shared across replicas — only the leader writes the LE account
  # state; followers read it. Mode 0750 + group faas is the ADR-069
  # contract.
  ansible.builtin.file:
    path: /var/lib/faas/ca
    state: directory
    owner: faas
    group: faas
    mode: "0750"

- name: gatewayd_public_service — install systemd unit
  ansible.builtin.copy:
    src: faas-gatewayd-public.service
    dest: /etc/systemd/system/faas-gatewayd-public.service
    owner: root
    group: root
    mode: "0644"
  register: gatewayd_public_unit

- name: gatewayd_public_service — systemctl daemon-reload (idempotent, after new unit file)
  ansible.builtin.systemd:
    daemon_reload: true
  when: gatewayd_public_unit.changed