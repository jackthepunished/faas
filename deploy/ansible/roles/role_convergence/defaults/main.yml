---
# Services allowed on each production box role. The legacy combined
# gatewayd unit is included in the forbidden set because it is not part of
# the split-box service contract and may survive an older installation.
faas_control_plane_units:
  - faas-apid.service
  - faas-schedd.service
  - faas-meterd.service
  - faas-gatewayd-public.service
  - faas-githubd.service

faas_compute_only_units:
  - faas-vmmd.service
  - faas-gatewayd-internal.service
  - faas-builderd.service
  - faas-imaged.service

faas_legacy_units:
  - faas-gatewayd.service
  # This unit was present on older one-box hosts but has no role-owned
  # implementation in the split-box tree; builderd now owns spool sync.
  - faas-spool-sync.service
