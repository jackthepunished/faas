# Build-time image seed inventory. This is deliberately separate from the
# production split-box inventory: the Packer VM bakes the maximal daemon and
# unit set into a role-agnostic image, while first boot applies exactly one
# control-plane or compute-only role via gregalectl release install --role.
[control_plane]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[compute_nodes]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3
