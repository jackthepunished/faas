# DO dev deployment — apid config.
# Loopback bind: matches FAAS_APID_LISTEN in sealed.env. gatewayd-public is the
# only public listener (spec §11); this listener is reached via the
# gatewayd-internal → apid reverse proxy. This TOML is parsed by wire.Daemon for
# logging only — the authoritative bind is FAAS_APID_LISTEN.
listen_addr = "127.0.0.1:8081"
base_domain = "__DROPLET_IP__.nip.io"
log_level = "info"
# db_url read from $DATABASE_URL in sealed.env

# PR-P2: [billing] block — provider config. Default is Stripe (legacy).
# Override per-deployment by changing provider and uncommenting the
# matching sub-block. Secrets stay in sealed.env — never paste them
# into this TOML. Env > TOML precedence: $STRIPE_API_KEY wins over
# api_key, $FAAS_PADDLE_API_KEY wins over api_key, etc.
[billing]
provider = "stripe"

[billing.stripe]
# api_key + webhook_secret come from $STRIPE_API_KEY + $STRIPE_WEBHOOK_SECRET (sealed.env)
tolerance_seconds = 300

[billing.paddle]
# api_key + webhook_secret come from $FAAS_PADDLE_API_KEY + $FAAS_PADDLE_WEBHOOK_SECRET (sealed.env)
sandbox = false
