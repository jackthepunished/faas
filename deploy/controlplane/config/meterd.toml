# DO dev deployment — meterd config.
schedd_socket = "/run/faas/schedd.sock"
metrics_addr = "127.0.0.1:9106"

# Canonical gatewayd-internal egress stream socket. Keep this aligned with
# cmd/gatewayd-internal and the meterd resolver; the legacy gatewayd-egress.sock
# path is retained only as a one-release compatibility fallback.
egress_socket = "/run/faas/egress.sock"

[meter]
sample_interval = "60s"
quota_interval = "60s"
stripe_interval = "3600s"

# PR-P2: [billing] block — provider config. Default is Stripe (legacy).
# Override per-deployment by changing provider and uncommenting the
# matching sub-block. Secrets stay in sealed.env — never paste them
# into this TOML. meterd doesn't read webhook_secret (no ingress).
[billing]
provider = "stripe"

[billing.stripe]
# api_key comes from $STRIPE_API_KEY (sealed.env)
tolerance_seconds = 300

[billing.paddle]
# api_key comes from $FAAS_PADDLE_API_KEY (sealed.env)
sandbox = false
