# /etc/tmpfiles.d/faas.conf
#
# Pre-create /run/faas with the correct ownership before any
# faas-*.service unit starts. Closes the restart-cycle race where
# systemd's RuntimeDirectory=faas on faas-vmmd.service creates the
# dir as root:root 0755, the ExecStartPre chown flips it to
# root:faas 0775, but schedd + apid dial /run/faas/vmmd.sock
# during the chown window and get bind: permission denied
# (cd-controlplane run 31121004495, post PR #633 deploy 2026-08-04).
#
# Shipped by cd-controlplane.yml "Install systemd service units"
# step (a new `install -m 0644 ... /etc/tmpfiles.d/faas.conf`
# line) and by ansible's control_plane_service role for the
# non-cd control-plane variant. The runtime is then run explicitly
# via `systemd-tmpfiles --create /etc/tmpfiles.d/faas.conf` so
# the dir is created during the deploy without waiting for a
# reboot.
d /run/faas 0775 root faas -
