# sqlc config — Postgres-backed Store (spec §5, ADR-006, CLAUDE.md
# "SQL via sqlc only"). Generated *.sql.go files are committed; CI regenerates
# to a tmpdir and diffs (analog of the existing proto-check gate).
#
# Install:   go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.27.0
# Generate:  sqlc generate
# Verify:    make sqlc-check
version: "2"
sql:
  - engine: "postgresql"
    queries: "pkg/state/queries.sql"
    # Generated by `make schema-dump` (post-migration `pg_dump -s`).
    # sqlc v1.27.0 does not merge multiple `create table` statements
    # across migration files; `migrations/00002_app_manifest_and_domains.sql`
    # uses `create table if not exists crons` to add `created_at`, but the
    # 00001_init.sql table already exists, so the production schema has
    # no `created_at` on `crons` — `pgstore.go:3946-3964` already knows
    # this. Pointing sqlc at the merged schema.sql is the only way to
    # get sqlc to see the *actual* production shape.
    schema: "schema.sql"
    gen:
      go:
        package: "sqlc"
        out: "pkg/state/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        # sqlc v1.27.0 spells this `emit_methods_with_db_argument`; the prior
        # name was an aborted v2 proposal. Required so generated query
        # methods accept a pgx DBTX arg instead of stashing one on Queries.
        emit_methods_with_db_argument: true
        emit_json_tags: false
        emit_prepared_queries: false
        emit_empty_slices: true
        rename:
          id: "ID"
