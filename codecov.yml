# Codecov status-check configuration for poyrazK/faas.
# Status checks here translate into GitHub commit statuses.
# See https://docs.codecov.com/docs/commit-status

codecov:
  notify:
    # MUST equal the number of coverage uploads CI sends per commit.
    # Codecov holds ALL notifications — including the project/patch
    # commit statuses below — until it has received this many uploads.
    # ci.yml has four uploading unit test jobs (`unit-tests-pg-1`,
    # `unit-tests-pg-2`, `unit-tests-pure-1`, `unit-tests-pure-2`,
    # all uploading under flag `unittests`).
    after_n_builds: 4
    wait_for_ci: true

coverage:
  precision: 1       # 44.9% not 44.87654%
  round: down
  range: "70...90"   # target band — colour the badge accordingly
  status:
    project:
      # Measured 51.6% on 2026-07-25 (263 files, 28,589 lines, 14,753
      # hits) — the first commit whose upload Codecov ever accepted.
      # The previous 70% here was written from an estimate, never
      # verified, and was unreachable: no upload had ever landed, so no
      # status was ever posted to contradict it.
      #
      # 50% is a floor just under today's real number. It is a FIXED
      # floor, so raise it by hand as the suite grows — it will not
      # catch a slow slide from 51.6% to 50.1%.
      default:
        target: 50%
        threshold: 1%
        if_ci_failed: success   # don't double-fail with the test job
        only_pulls: false
    patch:
      # Per-PR: if your PR drops uncovered lines, fail it. Currently
      # informational — we'll flip when we have a few milestones of
      # history showing the rule is meaningful.
      default:
        target: 70%
        threshold: 5%
        informational: true
        only_pulls: true

# Comment template — kept terse so the PR conversation doesn't drown.
comment:
  layout: "header, diff, flags, components, files, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

# Component-level partitions let Codecov attribute coverage to packages
# the spec actively validates (those exercised by the property-based
# invariant suite). These don't enforce thresholds yet — they only
# colour the badge.
component_management:
  # NOTE: `default_rules: null` here made this ENTIRE file invalid
  # ("Error at ['component_management', 'default_rules']: null value not
  # allowed" from https://codecov.io/validate). Codecov discards a config
  # it cannot parse and falls back to its defaults, so nothing below —
  # and nothing above — was in effect. That is why the `ignore` list at
  # the bottom never applied: all 6 generated *.pb.go files were still
  # counted, 2029 lines at 0%, dragging the project number down.
  # Omit the key entirely rather than setting it null.
  individual_components:
    - component_id: core_runtime
      paths:
        - pkg/fcvm/**
        - pkg/fcvm/leakcheck/**
        - pkg/netns/**
        - pkg/wire/**
    - component_id: control_plane
      paths:
        - pkg/api/**
        - pkg/grpcerr/**
        - pkg/vmmdgrpc/**
        - api/proto/**
    - component_id: state_runtime
      paths:
        - pkg/sched/**
    - component_id: pkg_state
      paths:
        - pkg/state/**
      statuses:
        - type: project
          target: 70%
          threshold: 2%
          informational: false
          only_pulls: false

ignore:
  - "**/*.pb.go"
  - "**/*_grpc.pb.go"
  - "guest/runners/**"
  - "deploy/**"
  # pkg/e2etest is harness code for cmd/e2e, not product code. It is
  # never the subject of a test, so it reported 701 lines at 0% and was
  # counted against the project number as if it were untested product.
  - "pkg/e2etest/**"
  # pkg/state/sqlc/* is generated by `make sqlc-generate` (sqlc v1.27.0
  # against pkg/state/queries.sql + schema.sql). The sqlc-check CI gate
  # keeps it in sync; the M5.1 migration is when the hand-written
  # PgStore (ADR-017) calls into it. Today it is unused product code
  # and reporting it at 0% is noise.
  - "pkg/state/sqlc/**"
