# .github/workflows/images.yml — Gregale OCI base image pipeline (issue #938, ADR-114).
#
# Builds and publishes ghcr.io/poyrazk/builder-base for linux/amd64
# + linux/arm64 on every push to main. PR builds run against a local
# registry service container and a post-build crane-based verification
# step asserts /usr/local/bin/faas-guest-init exists in the just-pushed
# image's amd64 manifest (the kernel-cmdline PID1 binary every
# builder microVM hands control to — see images/builder-base.Dockerfile).
#
# guest-init is built INSIDE the Dockerfile via a multi-stage cross-
# compile (see images/builder-base.Dockerfile stage 1). Each arch's
# manifest receives the arch-matching binary because buildx resolves
# TARGETARCH per image in the multi-arch build — no host-side pre-
# build, no overwrite bug (review finding #2 on PR #940).
#
# Why a separate workflow (not an extension of ci.yml):
#  - ci.yml is the Go bundle (test, unit-tests-pg-*, metal, migrations,
#    spec-check) with concurrency: cancel-in-progress on PR pushes —
#    adding docker buildx jobs there would cancel each other and bloat
#    the bundle.
#  - This workflow needs packages:write to push to ghcr.io; scoping it
#    to its own file keeps the elevated permission minimal.
#
# The workflow is intentionally always scheduled for pull requests and
# main pushes. `runtime-change` is the cheap path filter inside the
# workflow, which means the final `runtime-contract-gate` check exists on
# every PR even when the eight-image matrix is not needed. Keeping the
# decision in a job (rather than in `on.pull_request.paths`) prevents a
# runtime-code change from silently bypassing the contract gate.
# workflow_dispatch remains the manual reroll path (e.g. after a BuildKit /
# Railpack bump).
#
# Why a service container for the local registry (PR #940 CI follow-
# up, runs #1–#7): seven prior attempts all failed.
#   #1 `docker run -d --network=host`           (ex44/local mental model)
#   #2 `docker run -d -p 5000:5000`             (first workflow revision)
#   #3 services:registry + ports[5000] (numeric index) — actionlint
#      error: property access on string-keyed map.
#   #4 services:registry + ports['5000'] + step-level env — YAML
#      validated, but the curl/wait loop hung past its 30-iter
#      ceiling for the full job timeout.
#   #5 `localhost:5000` everywhere + custom buildkit driver — the
#      curl/wait loop succeeded (curl on the runner namespace hits
#      the bridge gateway), but the buildx push (running inside a
#      separate `moby/buildkit:v0.32.2` container) hit
#      `dial tcp [::1]:5000: connect: connection refused`.
#   #6 `registry:5000` (service label) everywhere — runner's curl
#      cannot resolve the label (DNS resolver doesn't try the
#      docker bridge network); step 7 failed fast.
#   #7 dual namespace (`localhost:5000` for runner, `registry:5000`
#      for push) — step 7 succeeded, but buildkitd also could
#      not resolve `registry` (`no such host`); buildkitd also
#      defaulted to https:// for an HTTP-only endpoint.
# Resolution (run #8+): one network, one address.
#   - `driver-opts: network=host` puts buildkitd on the runner's
#     host network namespace, where `localhost:5000` resolves to
#     the same registry port-published to the runner's loopback
#     (verified on runs #5 and #7: step 7's curl GET /v2/ → 200
#     in <1s).
#   - `BUILDKIT_TLS_VERIFY=0` env on step 9 stops buildkit from
#     upgrading the push to https:// for an HTTP-only registry.
# Service containers stay alive for the entire 25-min job —
# sidestepping the death-mid-build bug that killed run #1/#2.

name: images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # ghcr.io/poyrazk push (GITHUB_TOKEN)

jobs:
  # Keep this detector small and dependency-free. It is the single source
  # of truth for whether the expensive image matrix is required, and its
  # output is consumed by the always-on gate below.
  runtime-change:
    name: runtime change detection
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.changed.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect runtime-affecting changes
        id: changed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: runtime matrix requested."
            exit 0
          fi

          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            head="$CURRENT_SHA"
          fi

          # A first push has no usable parent. Fail closed toward running
          # the matrix; a false negative here would be a silent bypass.
          if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "No usable base SHA: runtime matrix requested."
            exit 0
          fi

          changed="$(git diff --name-only "$base" "$head")"
          printf '%s\n' "$changed"
          if grep -Eq '^(images/|guest/init/|guest/runners/|pkg/(builderd|imaged|oci|rootfs|api)/|cmd/imaged/|cmd/apid/handlers_templates(_test)?\.go$|cmd/gregale/templates/|cmd/gregale/cli_meta\.go$|cmd/gregale/commands_init|migrations/.*runtime.*\.sql$|scripts/ci/(validate-runtime-image|smoke-runtime-image|validate-runtime-docs)\.sh$|docs/runtimes/|docs/faas_implementation_spec\.md$|\.github/workflows/images\.yml$)' <<<"$changed"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Runtime-affecting change detected."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No runtime-affecting change detected."
          fi

  builder-base:
    name: builder-base (linux/amd64 + linux/arm64)
    needs: runtime-change
    if: needs.runtime-change.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Issue #938 / PR-B / ADR-114: PR builds push to a local
    # registry service container so the verify step can `crane
    # export` the just-built image. Service containers stay
    # alive for the entire 25-min job — the docker-bridge-vs-
    # host-net ambiguity and container-OOM issues from earlier
    # attempts (PR #940 CI follow-ups) are sidestepped by
    # GitHub's job-lifecycle guarantees.
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      IMAGE_NAME: ghcr.io/poyrazk/builder-base
      BUILDKIT_VERSION: "0.32.2"
      RAILPACK_VERSION: "0.31.1"
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/setup-buildx-action@v3
        # `driver-opts: network=host` puts the buildkitd container
        # on the runner's host network namespace. That makes
        # `localhost:5000` resolve the same way in both namespaces:
        #   - the runner's curl probes `localhost:5000` via the
        #     service container's port publish to the runner's
        #     loopback (verified in run #32013676953 — step 7's
        #     curl GET /v2/ → 200 succeeded in <1s);
        #   - buildkitd's push to `localhost:5000` also reaches the
        #     same registry without needing DNS for the
        #     `registry` service label (which only resolves inside
        #     `github_network_*`, which neither namespace's DNS
        #     can see, hence the `no such host` failure on
        #     run #32013676953).
        # Earlier attempts:
        #   - default driver + service label `registry:5000` →
        #     `dial tcp: lookup registry on 168.63.129.16:53: no
        #     such host` (DNS lookup misses; also no network join).
        #   - explicit `image=moby/buildkit:v0.32.2` driver +
        #     `localhost:5000` → `dial tcp [::1]:5000: connect:
        #     connection refused` (custom container is on its own
        #     namespace; no host loopback).
        # `network=host` sidesteps both.
        with:
          driver-opts: network=host

      - name: Login to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Wait probe: hit `localhost:5000` from the runner's namespace.
      # With `driver-opts: network=host` on setup-buildx-action
      # (step 5), buildkitd's namespace shares this view — the same
      # `localhost:5000` works from buildkitd's push step below.
      # Earlier service-label (`registry:5000`) and dual-namespace
      # approaches both fell over (DNS lookup fails; custom
      # buildkit containers don't share the loopback).
      - name: Wait for registry (PR / dispatch)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          for _ in $(seq 1 30); do
            if curl -sf --connect-timeout 2 --max-time 3 \
                 http://localhost:5000/v2/ >/dev/null; then
              echo "registry ready on localhost:5000 (runner namespace)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::local registry did not become ready"
          exit 1

      - name: Build + push (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg BUILDKIT_VERSION \
            --build-arg RAILPACK_VERSION \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${IMAGE_NAME}:latest" \
            --tag "${IMAGE_NAME}:sha-${GITHUB_SHA}" \
            --push \
            -f images/builder-base.Dockerfile .

      - name: Build + push (PR / dispatch)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        env:
          # buildkit (the daemon behind `docker buildx`) defaults
          # to https:// for any registry endpoint it doesn't
          # recognize as plaintext. The local registry on
          # `localhost:5000` serves plain HTTP only; this env tells
          # buildkit to skip the TLS upgrade.
          BUILDKIT_TLS_VERIFY: "0"
        run: |
          # Build against `localhost:5000`. The buildkitd container
          # is on the runner's host network (driver-opts above), so
          # `localhost:5000` resolves to the same port-published
          # registry as the runner's curl. Multi-arch with cross-
          # compiled guest-init so each manifest carries the arch-
          # matching /usr/local/bin/faas-guest-init binary
          # (review finding #2 on PR #940).
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg BUILDKIT_VERSION \
            --build-arg RAILPACK_VERSION \
            --tag "localhost:5000/pr-${GITHUB_SHA::12}" \
            --push \
            -f images/builder-base.Dockerfile .

      # Verify the linux/amd64 manifest in the just-built (or
      # just-pushed) image contains /usr/local/bin/faas-guest-init.
      # The Lima local-build path checks the same thing at
      # deploy/lima/faas-metal.yaml:482-490; this is the CI
      # equivalent. imaged rejects manifest lists at
      # cmd/imaged/main.go:392-401 so operators will pin the
      # amd64-specific digest via `crane digest --platform
      # linux/amd64`.
      - name: Verify faas-guest-init is in the image
        run: |
          set -euo pipefail
          # Earlier attempts called `go install
          # github.com/google/go-containerregistry/cmd/crane@latest`
          # which surfaced exit 127 ('command not found') on
          # Ubuntu 24.04 GitHub runners: go-containerregistry
          # v0.21.9 requires Go ≥ 1.25.0, so go install switched
          # the toolchain to go1.25.13 and dropped the binary in
          # $GOPATH/bin, which isn't on the step's PATH by
          # default. Skip the toolchain dance and install a
          # static pre-built crane from the upstream release
          # tarball instead — same code, no Go-toolchain auto-
          # fetch race, lands at an absolute path.
          curl -fsSL -o /tmp/crane.tgz \
            https://github.com/google/go-containerregistry/releases/download/v0.21.1/go-containerregistry_Linux_x86_64.tar.gz
          tar -C /usr/local/bin -xzf /tmp/crane.tgz crane
          chmod +x /usr/local/bin/crane
          rm /tmp/crane.tgz
          if [ "${GITHUB_REF_NAME:-}" = "main" ] && \
             [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            # Verify the immutable full-SHA tag, not only the convenience
            # latest tag. Deployments must be able to reproduce this exact
            # image even after latest advances.
            REF="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          else
            # Verify step runs from the runner namespace; the
            # published port is reachable via the bridge
            # gateway at localhost:5000 (same as step 7).
            REF="localhost:5000/pr-${GITHUB_SHA::12}"
          fi
          DIGEST=$(crane manifest "${REF}" 2>/dev/null | \
            jq -r '.manifests[] | select(.platform.architecture=="amd64").digest')
          if [ -z "${DIGEST}" ] || [ "${DIGEST}" = "null" ]; then
            echo "::error::no amd64 manifest in ${REF}"
            exit 1
          fi
          crane export "${REF}@${DIGEST}" /tmp/rootfs.tar
          mkdir -p /tmp/rootfs && tar -xf /tmp/rootfs.tar -C /tmp/rootfs
          if [ ! -x /tmp/rootfs/usr/local/bin/faas-guest-init ]; then
            echo "::error::faas-guest-init missing from ${REF}@${DIGEST}"
            echo "The build pipeline produced a rootfs without the PID1"
            echo "binary. Check images/builder-base.Dockerfile COPY path"
            echo "and the guest-init build stage."
            exit 1
          fi
          echo "OK: ${REF}@${DIGEST} contains /usr/local/bin/faas-guest-init"

      # The compute admission gate refuses any staged builder ext4 with a
      # CRITICAL finding. Scan the exact registry artifact produced by this
      # job before a main-branch image can become the release input; otherwise
      # the first vulnerability signal arrives only after imaged has staged
      # the image on a production node and every builder wake is blocked.
      - name: Scan builder base for critical vulnerabilities
        env:
          GRYPE_VERSION: "0.116.0"
          GRYPE_SHA256: "40aff724297312f91ea390d003bed8d8651c74cc7f5b26732db80b3a408d2fc5"
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" -C "$RUNNER_TEMP" grype
          chmod 0755 "$RUNNER_TEMP/grype"
          "$RUNNER_TEMP/grype" db update
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            ref="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          else
            ref="localhost:5000/pr-${GITHUB_SHA::12}"
          fi
          "$RUNNER_TEMP/grype" "registry:${ref}" \
            --platform linux/amd64 \
            --fail-on critical \
            -o table

  # Runtime bases are single-arch artifacts today because the image lock and
  # the production compute fleet pin linux/amd64 children. They are published
  # separately from the multi-arch builder image so an operator can resolve a
  # concrete digest and imaged never receives a manifest list.
  runtime-bases:
    name: ${{ matrix.image }} (linux/amd64)
    needs: runtime-change
    if: needs.runtime-change.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: base-debian-parent
            dockerfile: images/base-debian-parent.Dockerfile
          - image: base-minimal
            dockerfile: images/base-minimal.Dockerfile
          - image: runner-node22
            dockerfile: images/runner-node22.Dockerfile
          - image: runner-node24
            dockerfile: images/runner-node24.Dockerfile
          - image: runner-python312
            dockerfile: images/runner-python312.Dockerfile
          - image: runner-python313
            dockerfile: images/runner-python313.Dockerfile
          - image: runner-go124
            dockerfile: images/runner-go124.Dockerfile
          - image: runner-go124-alpine
            dockerfile: images/runner-go124-alpine.Dockerfile
    env:
      IMAGE_NAME: ghcr.io/poyrazk/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Login to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push runtime base (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag "${IMAGE_NAME}:latest" \
            --tag "${IMAGE_NAME}:sha-${GITHUB_SHA}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --push \
            -f "${{ matrix.dockerfile }}" .

      - name: Build runtime base (PR / dispatch)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag "${IMAGE_NAME}:pr-${GITHUB_SHA::12}" \
            --load \
            -f "${{ matrix.dockerfile }}" .

      - name: Pull runtime base for contract validation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker pull "${IMAGE_NAME}:sha-${GITHUB_SHA}"

      - name: Verify runtime rootfs contract
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            ref="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          else
            ref="${IMAGE_NAME}:pr-${GITHUB_SHA::12}"
          fi
          bash scripts/ci/validate-runtime-image.sh "${ref}" "${{ matrix.image }}"
          if [[ "${{ matrix.image }}" != "base-debian-parent" && "${{ matrix.image }}" != "base-minimal" ]]; then
            bash scripts/ci/smoke-runtime-image.sh "${ref}" "${{ matrix.image }}"
          fi

  # Keep source-artifact tests parallel with the image matrix. This job runs
  # on every PR because it is small enough to be a useful always-on signal;
  # the final gate below still aggregates its result fail-closed.
  runtime-source-contract:
    name: runtime source contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # These tests exercise the builder-produced source-artifact handoff:
      # dependency-complete Node/Python source stays intact, Go's /app/server
      # becomes the runner's /app/handler, and every supported runtime keeps
      # its canonical handler path.
      - name: Source-artifact adapter smoke
        run: >-
          go test ./pkg/rootfs ./pkg/imaged
          -run 'TestNormalizeFunctionHandler|TestBuildFunctionLayer_UsesSourceBuildOCIForGoRuntimes|TestMakeGoHandlerLayer|TestFunctionHandlerPaths_CoversAllSupportedRuntimes'
          -count=1 -timeout=120s

  # This exact job name is intended to become a required ruleset check after
  # this workflow has merged. `always()` is essential: on unrelated PRs the
  # expensive jobs are skipped by design, but this stable check must still
  # report success instead of disappearing from the checks list.
  runtime-contract-gate:
    name: runtime-contract-gate
    if: always()
    needs: [runtime-change, runtime-source-contract, builder-base, runtime-bases]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Validate runtime documentation contract
        run: bash scripts/ci/validate-runtime-docs.sh

      - name: Enforce runtime matrix result
        env:
          DETECTION_RESULT: ${{ needs.runtime-change.result }}
          SOURCE_RESULT: ${{ needs.runtime-source-contract.result }}
          RELEVANT: ${{ needs.runtime-change.outputs.relevant }}
          BUILDER_RESULT: ${{ needs.builder-base.result }}
          BASES_RESULT: ${{ needs.runtime-bases.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DETECTION_RESULT" != success ]]; then
            echo "::error::runtime change detection did not complete: $DETECTION_RESULT"
            exit 1
          fi
          if [[ "$SOURCE_RESULT" != success ]]; then
            echo "::error::runtime source contract did not complete: $SOURCE_RESULT"
            exit 1
          fi
          if [[ "$RELEVANT" != true ]]; then
            echo "No runtime-affecting files changed; runtime image matrix was not required."
            exit 0
          fi
          for result in "$BUILDER_RESULT" "$BASES_RESULT"; do
            if [[ "$result" != success ]]; then
              echo "::error::runtime image contract result: $result"
              exit 1
            fi
          done
          echo "Runtime image and source-artifact contracts passed."
